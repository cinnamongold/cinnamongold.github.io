<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="blog-post-card">
        <img
          alt="a person using a computer"
          class="post-img"
          src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
        >

        <div class="post-content">
            <h2 class="post-title">Make a Google Doc Today</h2>
            <p class="post-excerpt">
                It's super easy and fun to make google documents!!! All you have to do is go to docs.google.com and make a new one ok bye
            </p>
            <a href="https://google.com/robots.txt" class="read-more">Read More</a>
        </div>
    </div>
</body>
</html>
